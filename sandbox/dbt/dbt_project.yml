name: sandbox
version: "1.0.0"
config-version: 2
profile: sandbox

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

models:
  sandbox:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
