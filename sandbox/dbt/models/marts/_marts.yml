version: 2

models:
  - name: dim_customers
    description: "Dimensão de clientes com país e região. Grain: 1 linha por customer_key."
    columns:
      - name: customer_key
        description: Chave primária do cliente.
        data_tests: [unique, not_null]
      - name: customer_name
        description: Nome do cliente.
      - name: address
        description: Endereço do cliente.
      - name: phone
        description: Telefone do cliente.
      - name: account_balance
        description: Saldo da conta.
      - name: market_segment
        description: Segmento de mercado.
      - name: nation_key
      - name: nation_name
        description: Nome do país.
        data_tests: [not_null]
      - name: region_key
      - name: region_name
        description: Nome da região (AFRICA, AMERICA, ASIA, EUROPE, MIDDLE EAST).
        data_tests: [not_null]

  - name: fct_orders
    description: >
      Fato de pedidos. Grain: 1 linha por order_key.
      net_revenue = soma de net_amount dos itens do pedido (após desconto, antes de impostos).
      Pedidos sem itens têm line_count = 0 e net_revenue = 0.
    columns:
      - name: order_key
        description: Chave primária do pedido.
        data_tests: [unique, not_null]
      - name: customer_key
        description: FK para dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: order_date
        data_tests: [not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['O', 'F', 'P']
      - name: order_priority
      - name: total_price
        description: Valor total informado na source (inclui impostos); não é igual a net_revenue.
      - name: line_count
        description: Quantidade de itens do pedido.
        data_tests: [not_null]
      - name: total_quantity
      - name: net_revenue
        description: Receita líquida do pedido.
        data_tests: [not_null]
      - name: late_line_count
        description: Quantidade de itens recebidos após a data comprometida.
