[project]
name = "data-agents-sandbox"
version = "0.1.0"
description = "Sandbox local (DuckDB + dbt + Python) para validar o time de agentes de dados"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9",
    "polars",
    "pyarrow",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "ipykernel",
    "nbformat",
    "nbclient",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "sqlfluff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
